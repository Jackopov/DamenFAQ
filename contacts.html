<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kontakty — Damen Marine Components</title>
    <meta name="theme-color" content="#0a1128">
    <link rel="icon" href="images/Damen Marine logo.png">
    <link rel="manifest" href="manifest.json">
    <style>
        /* ═══════════════════════════════════════════════════════════════
           RESET & BASE — Dark Maritime Theme
           ═══════════════════════════════════════════════════════════════ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-deep: #0a1128;
            --bg-mid: #0d1b3e;
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-blur: 12px;
            --text-primary: #FFFFFF;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --accent: #38BDF8;
            --accent-glow: rgba(56, 189, 248, 0.2);
            --accent-border: rgba(56, 189, 248, 0.5);
            --accent-badge-bg: rgba(56, 189, 248, 0.15);
            --accent-badge-border: rgba(56, 189, 248, 0.3);
            --shadow-active: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 15px rgba(56, 189, 248, 0.2);
            --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ═══════════════════════════════════════════════════════════════
           HEADER
           ═══════════════════════════════════════════════════════════════ */
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            margin: 12px 16px 0;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            position: relative;
            z-index: 10;
        }
        .logo {
            width: 38px; height: 38px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .logo img { width: 100%; height: 100%; object-fit: contain; }
        .header-text { flex: 1; min-width: 0; }
        .header-text h1 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .header-text .subtitle {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 400;
        }
        .back-btn {
            font-size: 12px;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 6px 12px;
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            white-space: nowrap;
            transition: var(--transition-smooth);
            flex-shrink: 0;
        }
        .back-btn:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }

        /* ═══════════════════════════════════════════════════════════════
           SEARCH BAR
           ═══════════════════════════════════════════════════════════════ */
        .search-bar {
            padding: 10px 16px 0;
        }
        .search-wrap {
            position: relative;
        }
        .search-wrap::before {
            content: '🔍';
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            pointer-events: none;
            opacity: 0.6;
        }
        .search-bar input {
            width: 100%;
            padding: 10px 14px 10px 34px;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-bar input::placeholder { color: var(--text-muted); }
        .search-bar input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        /* ═══════════════════════════════════════════════════════════════
           DEPARTMENT PILLS
           ═══════════════════════════════════════════════════════════════ */
        .dept-pills {
            display: flex;
            gap: 6px;
            padding: 8px 16px 4px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .dept-pills::-webkit-scrollbar { display: none; }
        .dept-pill {
            flex-shrink: 0;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
            white-space: nowrap;
        }
        .dept-pill.active {
            background: var(--accent-badge-bg);
            color: var(--accent);
            border-color: var(--accent-badge-border);
            box-shadow: 0 2px 8px rgba(56, 189, 248, 0.12);
        }
        .dept-pill:hover:not(.active) { background: rgba(255,255,255,0.06); color: var(--text-secondary); }

        /* ═══════════════════════════════════════════════════════════════
           3D CYLINDRICAL WHEEL
           ═══════════════════════════════════════════════════════════════ */
        .wheel-viewport {
            position: relative;
            height: calc(100vh - 210px);
            max-width: 650px;
            width: 100%;
            margin: 0 auto;
            perspective: 1200px;
            overflow: hidden;
        }
        @media (max-width: 480px) {
            .wheel-viewport { max-width: 100%; height: calc(100vh - 200px); }
        }
        .wheel-track {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transform-style: preserve-3d;
        }

        /* ═══════════════════════════════════════════════════════════════
           CONTACT CARD
           ═══════════════════════════════════════════════════════════════ */
        .card {
            position: absolute;
            width: 100%;
            left: 0;
            height: 110px;
            top: 50%;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 18px 20px;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            transition: var(--transition-smooth);
            will-change: transform, opacity;
        }

        /* ── Active card ─────────────────────────────────────────── */
        .card.active {
            background: rgba(255, 255, 255, 0.09);
            border-color: var(--accent-border);
            box-shadow: var(--shadow-active);
            z-index: 5;
        }

        /* ── Name ────────────────────────────────────────────────── */
        .card .name {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card.active .name { color: #FFFFFF; }

        /* ── Position ────────────────────────────────────────────── */
        .card .position {
            font-size: 0.875rem;
            color: var(--text-secondary);
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card.active .position { color: #CBD5E1; }

        .card .position-en {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-style: italic;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card.active .position-en { color: var(--text-secondary); }

        /* ── Phone row ───────────────────────────────────────────── */
        .card .phone-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
        }
        .card .phone-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent);
            text-decoration: none;
            letter-spacing: 0.3px;
            transition: color 0.15s;
            min-height: 44px;
        }
        .card .phone-link:hover { color: #7DD3FC; }
        .card .phone-link::before {
            content: '📞';
            font-size: 0.8rem;
        }
        .card .phone-no {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-style: italic;
        }
        .card .phone-badge {
            font-size: 0.65rem;
            padding: 2px 7px;
            border-radius: 6px;
            background: var(--accent-badge-bg);
            color: var(--accent);
            border: 1px solid var(--accent-badge-border);
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        /* ── Department badge ────────────────────────────────────── */
        .card .dept-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #7DD3FC;
            background: var(--accent-badge-bg);
            border: 1px solid var(--accent-badge-border);
            padding: 3px 10px;
            border-radius: 20px;
            margin-top: 5px;
            width: fit-content;
        }

        /* ── Call button (active card only) ──────────────────────── */
        .call-btn {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 44px; height: 44px;
            border-radius: 12px;
            border: 1px solid var(--accent-badge-border);
            background: var(--accent-badge-bg);
            backdrop-filter: blur(8px);
            color: var(--accent);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition-smooth);
            min-width: 44px;
            min-height: 44px;
        }
        .card.active .call-btn {
            opacity: 1;
            pointer-events: all;
        }
        .call-btn:hover {
            background: rgba(56, 189, 248, 0.25);
            transform: translateY(-50%) scale(1.08);
        }

        /* ═══════════════════════════════════════════════════════════════
           COUNTER & HINTS
           ═══════════════════════════════════════════════════════════════ */
        .counter {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            padding: 6px 0 2px;
        }
        .scroll-hint {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            opacity: 0.6;
            animation: fadeHint 3s ease 2s forwards;
        }
        @keyframes fadeHint { to { opacity: 0; } }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 60px 20px;
            font-size: 14px;
        }

        /* ═══════════════════════════════════════════════════════════════
           QUICK CONTACT BUBBLE
           ═══════════════════════════════════════════════════════════════ */
        .quick-contact {
            position: fixed;
            bottom: 16px;
            left: 16px;
            z-index: 1000;
            background: rgba(10, 17, 40, 0.92);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.35);
            padding: 12px 14px;
            min-width: 190px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: var(--transition-smooth);
        }
        .quick-contact.minimized .qc-body { display: none; }
        .quick-contact.minimized { min-width: auto; padding: 8px 12px; }
        .qc-minimize {
            position: absolute;
            top: 4px;
            right: 6px;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.08);
            border: none;
            color: var(--text-secondary);
            font-size: 15px;
            cursor: pointer;
            padding: 0;
            border-radius: 50%;
            z-index: 10;
            transition: var(--transition-smooth);
        }
        .qc-minimize:hover { color: var(--text-primary); background: rgba(255,255,255,0.15); }
        .qc-title {
            font-size: 9px;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 8px;
        }
        .qc-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
            padding: 4px 0;
        }
        .qc-item:last-child { margin-bottom: 0; }
        .qc-role { font-size: 11px; color: var(--text-secondary); }
        .qc-phone-link {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent);
            text-decoration: none;
        }
        .qc-phone-link:hover { text-decoration: underline; }

        /* ═══════════════════════════════════════════════════════════════
           RESPONSIVE
           ═══════════════════════════════════════════════════════════════ */
        @media (max-width: 480px) {
            .header { padding: 10px 14px; margin: 8px 10px 0; gap: 10px; }
            .logo { width: 32px; height: 32px; }
            .header-text h1 { font-size: 13px; }
            .back-btn { font-size: 11px; padding: 5px 10px; }
            .card { height: 100px; padding: 14px 16px; }
            .card .name { font-size: 1rem; }
            .card .position { font-size: 0.8rem; }
            .call-btn { width: 40px; height: 40px; right: 12px; }
        }
    </style>
</head>

        });
        pillsEl.innerHTML = depts.map(function(d) {
            return '<button class="dept-pill' + (d === activeDept ? ' active' : '') + '" data-dept="' + d + '">' + d + '</button>';
        }).join('');
    }

    pillsEl.addEventListener('click', function(e) {
        var btn = e.target.closest('.dept-pill');
        if (!btn) return;
        activeDept = btn.dataset.dept;
        pillsEl.querySelectorAll('.dept-pill').forEach(function(b) { b.classList.toggle('active', b === btn); });
        applyFilters();
    });

    /* ════════════════════════════════════════════════════════════════
       SEARCH + FILTER
       ════════════════════════════════════════════════════════════════ */
    searchIn.addEventListener('input', applyFilters);

    function applyFilters() {
        var q = searchIn.value.trim().toLowerCase();
        filtered = allContacts.filter(function(c) {
            if (activeDept !== 'Wszyscy' && c.department !== activeDept) return false;
            if (q) {
                var hay = (c.name + ' ' + c.position_pl + ' ' + c.position_en + ' ' + c.department + ' ' + c.email).toLowerCase();
                return hay.indexOf(q) !== -1;
            }
            return true;
        });
        filtered.sort(function(a, b) { return a.name.localeCompare(b.name, 'pl'); });
        activeIdx = 0;
        renderCards();
        positionCards(false);
    }

    /* ════════════════════════════════════════════════════════════════
       RENDER CARDS
       ════════════════════════════════════════════════════════════════ */
    function esc(s) {
        return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function renderCards() {
        track.innerHTML = '';
        if (!filtered.length) {
            track.innerHTML = '<div class="empty-state">Brak wyników dla podanych kryteriów</div>';
            counter.textContent = '0 / 0';
            return;
        }
        filtered.forEach(function(c, i) {
            var card = document.createElement('div');
            card.className = 'card';
            card.dataset.idx = i;

            var phoneHtml;
            if (c.phone) {
                phoneHtml =
                    '<a href="tel:' + esc(c.phone) + '" class="phone-link" onclick="event.stopPropagation()">' +
                    esc(c.phone) + '</a>' +
                    '<span class="phone-badge">kom</span>';
            } else {
                phoneHtml = '<span class="phone-no">Brak numeru</span>';
            }

            var positionEnHtml = c.position_en
                ? '<div class="position-en">' + esc(c.position_en) + '</div>'
                : '';

            card.innerHTML =
                '<div class="name">' + esc(c.name) + '</div>' +
                '<div class="position">' + esc(c.position_pl) + '</div>' +
                positionEnHtml +
                '<div class="phone-row">' + phoneHtml + '</div>' +
                '<div class="dept-badge">' + esc(c.department) + '</div>' +
                (c.phone ? '<button class="call-btn" title="Zadzwoń" onclick="event.stopPropagation();window.location.href=\'tel:' + esc(c.phone) + '\'">📞</button>' : '');

            card.addEventListener('click', function() {
                if (i !== activeIdx) { snapTo(i, true); }
                else if (c.phone) { window.location.href = 'tel:' + c.phone; }
            });

            track.appendChild(card);
        });
        counter.textContent = (activeIdx + 1) + ' / ' + filtered.length;
    }

    /* ════════════════════════════════════════════════════════════════
       3D POSITIONING
       ════════════════════════════════════════════════════════════════ */
    function positionCards(animate) {
        var cards = track.querySelectorAll('.card');
        if (!cards.length) return;

        if (animate) {
            track.style.transition = 'transform 0.45s cubic-bezier(0.4, 0, 0.2, 1)';
        } else {
            track.style.transition = 'none';
        }

        cards.forEach(function(card, i) {
            var diff = i - activeIdx;
            var abs = Math.abs(diff);

            // 3-tier scale: center=1.0, adjacent=0.88, far=0.65
            var scale;
            if (abs === 0) scale = SCALE_CENTER;
            else if (abs === 1) scale = SCALE_ADJ;
            else scale = SCALE_FAR;

            // 3D transforms
            var rotateX = diff * (ROTATE_MAX / VISIBLE_RADIUS) * -1;
            var translateZ = abs * DEPTH_STEP;
            var translateY = diff * (CARD_H * SPACING) - (CARD_H / 2);

            // Opacity: center full, adjacent 0.7, far fade out
            var opacity;
            if (abs === 0) opacity = 1;
            else if (abs === 1) opacity = 0.7;
            else opacity = Math.max(0, 0.45 - (abs - 2) * 0.12);

            card.style.transform =
                'translate3d(0, ' + translateY + 'px, ' + translateZ + 'px) ' +
                'rotateX(' + rotateX + 'deg) ' +
                'scale(' + scale + ')';
            card.style.opacity = opacity;
            card.style.zIndex = VISIBLE_RADIUS - abs + 10;
            card.classList.toggle('active', diff === 0);
        });

        counter.textContent = filtered.length ? (activeIdx + 1) + ' / ' + filtered.length : '0 / 0';
    }

    /* ════════════════════════════════════════════════════════════════
       SNAP / NAVIGATE
       ════════════════════════════════════════════════════════════════ */
    function snapTo(idx, animate) {
        if (!filtered.length) return;
        activeIdx = Math.max(0, Math.min(idx, filtered.length - 1));
        positionCards(animate);
    }

    /* ════════════════════════════════════════════════════════════════
       TOUCH / MOUSE / WHEEL / KEYBOARD
       ════════════════════════════════════════════════════════════════ */
    function onStart(y) {
        dragging = true;
        startY = y;
        startIdx = activeIdx;
        velocity = 0;
        lastY = y;
        lastT = Date.now();
        track.style.transition = 'none';
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    }

    function onMove(y) {
        if (!dragging) return;
        var now = Date.now();
        var dt = now - lastT;
        if (dt > 0) velocity = (lastY - y) / dt;
        lastY = y;
        lastT = now;

        var delta = (startY - y) / (CARD_H * SPACING);
        var newIdx = Math.round(startIdx + delta);
        newIdx = Math.max(0, Math.min(newIdx, filtered.length - 1));
        if (newIdx !== activeIdx) {
            activeIdx = newIdx;
            positionCards(false);
        }
    }

    function onEnd() {
        if (!dragging) return;
        dragging = false;
        var momentum = Math.round(velocity * 12);
        var target = Math.max(0, Math.min(activeIdx + momentum, filtered.length - 1));
        activeIdx = target;
        positionCards(true);
    }

    // Touch
    viewport.addEventListener('touchstart', function(e) { onStart(e.touches[0].clientY); }, { passive: true });
    viewport.addEventListener('touchmove', function(e) { onMove(e.touches[0].clientY); e.preventDefault(); }, { passive: false });
    viewport.addEventListener('touchend', onEnd);

    // Mouse
    viewport.addEventListener('mousedown', function(e) { e.preventDefault(); onStart(e.clientY); });
    document.addEventListener('mousemove', function(e) { onMove(e.clientY); });
    document.addEventListener('mouseup', onEnd);

    // Wheel
    viewport.addEventListener('wheel', function(e) {
        e.preventDefault();
        snapTo(activeIdx + (e.deltaY > 0 ? 1 : -1), true);
    }, { passive: false });

    // Keyboard
    document.addEventListener('keydown', function(e) {
        if (e.target === searchIn) return;
        if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); snapTo(activeIdx + 1, true); }
        else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); snapTo(activeIdx - 1, true); }
        else if (e.key === 'Enter') {
            var c = filtered[activeIdx];
            if (c && c.phone) window.location.href = 'tel:' + c.phone;
        }
    });

    /* ════════════════════════════════════════════════════════════════
       QUICK CONTACT MINIMIZE
       ════════════════════════════════════════════════════════════════ */
    var qcMin = document.getElementById('qc-minimize');
    var qc = document.getElementById('quick-contact');
    if (qcMin && qc) {
        qcMin.addEventListener('click', function() {
            qc.classList.toggle('minimized');
            qcMin.textContent = qc.classList.contains('minimized') ? '+' : '\u2013';
        });
    }
})();
</script>
</body>
</html>
