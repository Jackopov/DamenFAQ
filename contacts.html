<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kontakty — Damen Marine Components</title>
    <meta name="theme-color" content="#011736">
    <link rel="icon" href="images/Damen Marine logo.png">
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #011736 40%, #0d2147 100%);
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        /* ── Header ──────────────────────────────────────────────────── */
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            margin: 0 16px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            position: relative;
            z-index: 10;
        }
        .logo {
            width: 34px; height: 34px;
            border-radius: 7px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .logo img { width: 100%; height: 100%; object-fit: contain; }
        .header h1 {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .header .subtitle {
            font-size: 11px;
            color: #64748b;
            font-weight: 400;
        }
        .back-btn {
            margin-left: auto;
            font-size: 12px;
            color: #94a3b8;
            text-decoration: none;
            padding: 6px 12px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 6px;
            transition: all 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

        /* ── Search ──────────────────────────────────────────────────── */
        .search-bar {
            padding: 6px 16px;
        }
        .search-bar input {
            width: 100%;
            padding: 8px 12px 8px 32px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-bar input::placeholder { color: #475569; }
        .search-bar input:focus { border-color: #3b82f6; }
        .search-wrap {
            position: relative;
        }
        .search-wrap::before {
            content: '🔍';
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            pointer-events: none;
        }

        /* ── Department pills ─────────────────────────────────────────── */
        .dept-pills {
            display: flex;
            gap: 6px;
            padding: 4px 16px 2px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .dept-pills::-webkit-scrollbar { display: none; }
        .dept-pill {
            flex-shrink: 0;
            padding: 6px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(6px);
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .dept-pill.active {
            background: rgba(96, 165, 250, 0.15);
            color: #93c5fd;
            border-color: rgba(96, 165, 250, 0.3);
            box-shadow: 0 2px 8px rgba(96,165,250,0.15);
        }
        .dept-pill:hover:not(.active) { background: rgba(255,255,255,0.08); color: #e2e8f0; }

        /* ── 3D Cylindrical Wheel Container ───────────────────────────── */
        .wheel-container {
            position: relative;
            height: calc(100vh - 210px);
            perspective: 1200px;
            overflow: hidden;
            margin-top: 8px;
            max-width: 66%;
            margin-left: auto;
            margin-right: auto;
        }
        @media (max-width: 768px) {
            .wheel-container { max-width: 92%; }
        }
        .wheel-track {
            position: absolute;
            width: 100%;
            left: 0;
            height: 100%;
            top: 0;
            transform-style: preserve-3d;
        }

        /* ── Contact Card (glassmorphism) ────────────────────────────── */
        .card {
            position: absolute;
            width: 100%;
            left: 0;
            height: 100px;
            top: 50%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 10px 14px;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.35s cubic-bezier(0.23, 1, 0.32, 1),
                        opacity 0.35s ease,
                        box-shadow 0.35s ease,
                        background 0.35s ease,
                        border-color 0.35s ease;
            will-change: transform, opacity;
        }
        .card.active {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: #fff;
            border: 1px solid rgba(96, 165, 250, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25),
                        inset 0 1px 0 rgba(255,255,255,0.08);
            z-index: 5;
        }
        .card .name {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 2px;
            color: #e2e8f0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .card.active .name { color: #fff; }
        .card .position {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 1px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .card.active .position { color: #cbd5e0; }
        .card .position-en {
            font-size: 10px;
            color: #64748b;
            font-style: italic;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .card.active .position-en { color: #94a3b8; }
        .card .phone-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }
        .card .phone-num {
            font-size: 13px;
            font-weight: 700;
            color: #60a5fa;
            letter-spacing: 0.5px;
        }
        .card.active .phone-num { color: #93c5fd; }
        .card .phone-badge {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 6px;
            background: rgba(96,165,250,0.15);
            color: #60a5fa;
            font-weight: 600;
        }
        .card.active .phone-badge {
            background: rgba(96,165,250,0.2);
            color: #93c5fd;
        }
        .card .dept-badge {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 6px;
            background: rgba(255,255,255,0.06);
            color: #64748b;
            font-weight: 600;
            margin-top: 3px;
            display: inline-block;
        }
        .card.active .dept-badge {
            background: rgba(96,165,250,0.12);
            color: #93c5fd;
        }
        .card .email {
            font-size: 9px;
            color: #475569;
            margin-top: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .card.active .email { color: #94a3b8; }

        /* Call button on active card */
        .call-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px; height: 36px;
            border-radius: 10px;
            border: 1px solid rgba(96,165,250,0.3);
            background: rgba(96,165,250,0.15);
            backdrop-filter: blur(12px);
            color: #93c5fd;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            transition: transform 0.2s, background 0.2s;
            opacity: 0;
            pointer-events: none;
        }
        .card.active .call-btn {
            opacity: 1;
            pointer-events: all;
        }
        .call-btn:hover { background: rgba(52,211,153,0.2); border-color: rgba(52,211,153,0.4); color: #34d399; transform: translateY(-50%) scale(1.08); }

        /* ── Scroll indicator ─────────────────────────────────────────── */
        .scroll-hint {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #475569;
            pointer-events: none;
            animation: fadeHint 3s ease 2s forwards;
        }
        @keyframes fadeHint { to { opacity: 0; } }

        /* ── Counter ──────────────────────────────────────────────────── */
        .counter {
            position: fixed;
            bottom: 12px;
            right: 20px;
            font-size: 12px;
            color: #475569;
            font-weight: 600;
            z-index: 10;
        }

        /* ── Quick Contact bubble (always visible) ──────────────────── */
        .quick-contact {
            position: fixed;
            bottom: 16px;
            left: 16px;
            z-index: 1000;
            background: rgba(2, 29, 69, 0.9);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            padding: 10px 12px;
            min-width: 180px;
            backdrop-filter: blur(16px);
        }
        .qc-title {
            font-size: 10px;
            font-weight: 700;
            color: #93c5fd;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .qc-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            padding: 6px 8px;
            border-radius: 8px;
        }
        .qc-item:last-child { margin-bottom: 0; }
        .qc-role { font-size: 11px; color: #94a3b8; }
        .qc-phone {
            font-size: 13px;
            font-weight: 700;
            color: #93c5fd;
            text-decoration: none;
        }
        .qc-phone:hover { text-decoration: underline; }
    </style>
</head>

    <script>
    /* ── 3D Cylindrical Wheel Picker ────────────────────────────────── */
    (function () {
        const CARD_HEIGHT = 105;
        const VISIBLE_RADIUS = 4;
        const SCALE_CENTER = 1.0;
        const SCALE_MIN = 0.5;
        const ROTATE_MAX = 22;
        const TRANSLATE_Z = -100;

        let allContacts = [];
        let filtered = [];
        let activeIndex = 0;
        let activeDept = 'Wszyscy';
        let isScrolling = false;
        let scrollTimer = null;
        let startY = 0;
        let startOffset = 0;
        let velocity = 0;
        let lastY = 0;
        let lastTime = 0;
        let animFrame = null;
        let currentOffset = 0;
        let targetOffset = 0;

        const track = document.getElementById('wheel-track');
        const container = document.getElementById('wheel-container');
        const counter = document.getElementById('counter');
        const searchInput = document.getElementById('search-input');
        const deptPills = document.getElementById('dept-pills');

        /* ── Load data (inline fallback + fetch) ─────────────────────── */
        var INLINE_CONTACTS = [{"name":"Bartnicki Oskar","phone":"737444345","position_pl":"Konstruktor","position_en":"Engineering Specialist","email":"Oskar.Bartnicki@damen.com","department":"Engineering"},{"name":"Basa Sebastian","phone":"664453522","position_pl":"Kierownik Działu Utrzymania Ruchu","position_en":"Maintenance Department Manager","email":"Sebastian.Basa@damen.com","department":"Utrzymanie Ruchu"},{"name":"Bielski Piotr","phone":"692437678","position_pl":"Brygadzista (PP1)","position_en":"Chargehand","email":"Piotr.Bielski@damen.com","department":"Produkcja"},{"name":"Bieniecka-Hurka Aleksandra","phone":"532806813","position_pl":"Kierownik działu HR","position_en":"Human Resources Manager","email":"Aleksandra.Bieniecka.Hurka@damen.com","department":"HR"},{"name":"Błażejak Marcin","phone":"664925583","position_pl":"Magazynier","position_en":"Storeman","email":"magazyn.dmcgd@damen.com","department":"Magazyn"},{"name":"Bojanowski Marek","phone":"888969868","position_pl":"Konstruktor","position_en":"Engineering Specialist","email":"Marek.Bojanowski@damen.com","department":"Engineering"},{"name":"Bork Iwona","phone":"734415861","position_pl":"Księgowa (DR)","position_en":"Accountant","email":"Iwona.Bork@damen.com","department":"Księgowość"},{"name":"Borowski Tomasz","phone":"602752871","position_pl":"Specjalista ds. Zakupów","position_en":"Purchasing Specialist","email":"Tomasz.Borowski@damen.com","department":"Zaopatrzenie"},{"name":"Butkiewicz Jakub","phone":"880672401","position_pl":"Operator prasy","position_en":"Press Operator","email":"Jakub.Butkiewicz@damen.com","department":"Produkcja"},{"name":"Cybowicz Daniel","phone":"574091116","position_pl":"Specjalista utrzymania ruchu","position_en":"Maintenance Specialist","email":"Daniel.Cybowicz@damen.com","department":"Utrzymanie Ruchu"},{"name":"Cytrycka Marcelina","phone":"574408784","position_pl":"Specjalista ds. zakupów","position_en":"Purchasing Specialist","email":"Marcelina.Cytrycka@damen.com","department":"Zaopatrzenie"},{"name":"Dermiaha Daniel","phone":"602310732","position_pl":"Kierownik Odziału (PPM)","position_en":"Production Manager","email":"Daniel.Dermiaha@damen.com","department":"Produkcja"},{"name":"Droszkowski Adrian","phone":"882364146","position_pl":"Operator transportu","position_en":"Transport Operator","email":"","department":"Transport"},{"name":"Dzierbicki Bartosz","phone":"532466949","position_pl":"Kierownik Techniczny","position_en":"Technical Manager","email":"Bartosz.Dzierbicki@damen.com","department":"Zarządzanie"},{"name":"Ellwart Witold","phone":"","position_pl":"Brygadzista","position_en":"Chargehand","email":"","department":"Produkcja"},{"name":"Gala Marek","phone":"","position_pl":"Asystent Szefa Produkcji","position_en":"Production Assistant","email":"","department":"Produkcja"},{"name":"Gieroń Sławomir","phone":"","position_pl":"Dyrektor Zarządu","position_en":"Board Director","email":"","department":"Zarządzanie"},{"name":"Jaromiej Bogdan","phone":"","position_pl":"Kierownik Działu PP2","position_en":"Production Manager PP2","email":"","department":"Produkcja"},{"name":"Kozłowska Joanna","phone":"","position_pl":"Główna Księgowa","position_en":"Chief Accountant","email":"","department":"Księgowość"},{"name":"Kryla Piotr","phone":"","position_pl":"Kierownik Działu PP2","position_en":"Production Manager PP2","email":"","department":"Produkcja"},{"name":"Nawrocki Tomasz","phone":"501773805","position_pl":"Kierownik Działu Jakości","position_en":"Quality Manager","email":"Tomasz.Nawrocki@damen.com","department":"Jakość"},{"name":"Piechota Andrzej","phone":"","position_pl":"Technolog","position_en":"Technologist","email":"","department":"Engineering"},{"name":"Przewoźny Piotr","phone":"698870232","position_pl":"Kierownik Kompletacji","position_en":"Assembly Manager","email":"","department":"Produkcja"},{"name":"Rolnicka Bożena","phone":"","position_pl":"Kierownik Działu Org. Personalnych","position_en":"HR Department Manager","email":"","department":"HR"},{"name":"Sabatura Natalia","phone":"","position_pl":"Księgowa","position_en":"Accountant","email":"","department":"Księgowość"},{"name":"Włoch Jacek","phone":"","position_pl":"Tłumacz","position_en":"Translator","email":"","department":"Inne"},{"name":"Woźniak Wojciech","phone":"604525707","position_pl":"Szef Produkcji","position_en":"Production Director","email":"","department":"Zarządzanie"},{"name":"Zaboklicki Maciej","phone":"","position_pl":"Kierownik Magazynu/Kompletacji","position_en":"Warehouse Manager","email":"","department":"Magazyn"},{"name":"Żołądowski Janusz","phone":"602729347","position_pl":"Zaopatrzenie","position_en":"Purchasing","email":"","department":"Zaopatrzenie"},{"name":"Przybyłek Ilona","phone":"","position_pl":"Specjalista ds. Księgowości","position_en":"Accounting Specialist","email":"","department":"Księgowość"}];

        function loadData(data) {
            allContacts = data;
            filtered = [...allContacts];
            buildDeptPills();
            renderCards();
            snapTo(0, false);
        }

        // Try fetch first, fall back to inline
        fetch('contacts.json')
            .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
            .then(loadData)
            .catch(function() { loadData(INLINE_CONTACTS); });

        /* ── Department pills ────────────────────────────────────────── */
        function buildDeptPills() {
            const depts = ['Wszyscy'];
            const seen = new Set();
            allContacts.forEach(c => {
                if (!seen.has(c.department)) {
                    seen.add(c.department);
                    depts.push(c.department);
                }
            });
            deptPills.innerHTML = depts.map(d =>
                '<button class="dept-pill' + (d === activeDept ? ' active' : '') + '" data-dept="' + d + '">' + d + '</button>'
            ).join('');
        }

        deptPills.addEventListener('click', function(e) {
            const btn = e.target.closest('.dept-pill');
            if (!btn) return;
            activeDept = btn.dataset.dept;
            deptPills.querySelectorAll('.dept-pill').forEach(b => b.classList.toggle('active', b === btn));
            applyFilters();
        });

        /* ── Search ──────────────────────────────────────────────────── */
        searchInput.addEventListener('input', applyFilters);

        function applyFilters() {
            const q = searchInput.value.trim().toLowerCase();
            filtered = allContacts.filter(c => {
                if (activeDept !== 'Wszyscy' && c.department !== activeDept) return false;
                if (q) {
                    const hay = (c.name + ' ' + c.position_pl + ' ' + c.position_en + ' ' + c.department + ' ' + c.email).toLowerCase();
                    return hay.includes(q);
                }
                return true;
            });
            // Sort alphabetically
            filtered.sort((a, b) => a.name.localeCompare(b.name, 'pl'));
            activeIndex = 0;
            renderCards();
            snapTo(0, false);
        }

        /* ── Render cards ────────────────────────────────────────────── */
        function renderCards() {
            track.innerHTML = '';
            if (!filtered.length) {
                track.innerHTML = '<div style="text-align:center;color:#64748b;padding:40px;font-size:14px;">Brak wyników</div>';
                counter.textContent = '0 / 0';
                return;
            }
            filtered.forEach((c, i) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = i;

                const phoneHtml = c.phone
                    ? '<span class="phone-num">' + esc(c.phone) + '</span><span class="phone-badge">kom</span>'
                    : '<span class="phone-num" style="color:#64748b;font-size:13px;">brak numeru</span>';

                const emailHtml = c.email ? '<div class="email">✉ ' + esc(c.email) + '</div>' : '';

                card.innerHTML =
                    '<div class="name">' + esc(c.name) + '</div>' +
                    '<div class="position">' + esc(c.position_pl) + '</div>' +
                    (c.position_en ? '<div class="position-en">' + esc(c.position_en) + '</div>' : '') +
                    '<div class="phone-row">' + phoneHtml + '</div>' +
                    '<div class="dept-badge">' + esc(c.department) + '</div>' +
                    emailHtml +
                    (c.phone ? '<button class="call-btn" title="Zadzwoń">📞</button>' : '');

                // Click card to focus
                card.addEventListener('click', function() {
                    if (i !== activeIndex) {
                        snapTo(i, true);
                    } else if (c.phone) {
                        window.location.href = 'tel:' + c.phone;
                    }
                });

                // Click call button
                const callBtn = card.querySelector('.call-btn');
                if (callBtn && c.phone) {
                    callBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        window.location.href = 'tel:' + c.phone;
                    });
                }

                track.appendChild(card);
            });
            counter.textContent = (activeIndex + 1) + ' / ' + filtered.length;
        }

        /* ── Position cards on 3D cylinder ───────────────────────────── */
        function updatePositions() {
            const cards = track.querySelectorAll('.card');
            const center = activeIndex;
            const centerCardH = 100;

            cards.forEach((card, i) => {
                const diff = i - center;
                const absDiff = Math.abs(diff);

                // Scale: center = 1.0, distant = 0.5
                const t = Math.min(absDiff / VISIBLE_RADIUS, 1);
                const scale = SCALE_CENTER - t * (SCALE_CENTER - SCALE_MIN);

                // Gentle rotateX for 3D curvature
                const rotateX = diff * (ROTATE_MAX / VISIBLE_RADIUS) * -1;

                // Push cards back in depth
                const translateZ = -absDiff * (TRANSLATE_Z / VISIBLE_RADIUS);

                // Vertical offset from center — cards stack above/below
                const spacing = centerCardH * 0.78;
                const translateY = diff * spacing - (centerCardH / 2);

                // Opacity
                const opacity = absDiff > VISIBLE_RADIUS ? 0 : Math.max(0, 1 - t * 0.7);

                card.style.transform =
                    'translate3d(0, ' + translateY + 'px, ' + translateZ + 'px) ' +
                    'rotateX(' + rotateX + 'deg) ' +
                    'scale(' + scale + ')';
                card.style.opacity = opacity;
                card.style.zIndex = VISIBLE_RADIUS - absDiff + 10;

                if (diff === 0) {
                    card.classList.add('active');
                } else {
                    card.classList.remove('active');
                }
            });

            counter.textContent = filtered.length ? (activeIndex + 1) + ' / ' + filtered.length : '0 / 0';
        }

        /* ── Snap to index ───────────────────────────────────────────── */
        function snapTo(index, animate) {
            if (!filtered.length) return;
            activeIndex = Math.max(0, Math.min(index, filtered.length - 1));
            if (animate) {
                track.style.transition = 'transform 0.35s cubic-bezier(0.23, 1, 0.32, 1)';
            } else {
                track.style.transition = 'none';
            }
            updatePositions();
        }

        /* ── Touch / Mouse handling ──────────────────────────────────── */
        function onStart(y) {
            isScrolling = true;
            startY = y;
            startOffset = activeIndex;
            velocity = 0;
            lastY = y;
            lastTime = Date.now();
            track.style.transition = 'none';
            if (animFrame) cancelAnimationFrame(animFrame);
        }

        function onMove(y) {
            if (!isScrolling) return;
            const delta = startY - y;
            const now = Date.now();
            const dt = now - lastTime;
            if (dt > 0) {
                velocity = (lastY - y) / dt;
            }
            lastY = y;
            lastTime = now;

            const indexDelta = delta / CARD_HEIGHT;
            let newIdx = Math.round(startOffset + indexDelta);
            newIdx = Math.max(0, Math.min(newIdx, filtered.length - 1));
            if (newIdx !== activeIndex) {
                activeIndex = newIdx;
                updatePositions();
            }
        }

        function onEnd() {
            if (!isScrolling) return;
            isScrolling = false;

            // Apply momentum
            const momentum = Math.round(velocity * 8);
            let target = activeIndex + momentum;
            target = Math.max(0, Math.min(target, filtered.length - 1));

            track.style.transition = 'transform 0.4s cubic-bezier(0.23, 1, 0.32, 1)';
            activeIndex = target;
            updatePositions();
        }

        // Touch events
        container.addEventListener('touchstart', function(e) {
            onStart(e.touches[0].clientY);
        }, { passive: true });
        container.addEventListener('touchmove', function(e) {
            onMove(e.touches[0].clientY);
            e.preventDefault();
        }, { passive: false });
        container.addEventListener('touchend', onEnd);

        // Mouse events
        container.addEventListener('mousedown', function(e) {
            e.preventDefault();
            onStart(e.clientY);
        });
        document.addEventListener('mousemove', function(e) {
            onMove(e.clientY);
        });
        document.addEventListener('mouseup', onEnd);

        // Wheel event
        container.addEventListener('wheel', function(e) {
            e.preventDefault();
            const dir = e.deltaY > 0 ? 1 : -1;
            snapTo(activeIndex + dir, true);
        }, { passive: false });

        // Keyboard
        document.addEventListener('keydown', function(e) {
            if (e.target === searchInput) return;
            if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                e.preventDefault();
                snapTo(activeIndex + 1, true);
            } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                e.preventDefault();
                snapTo(activeIndex - 1, true);
            } else if (e.key === 'Enter') {
                const c = filtered[activeIndex];
                if (c && c.phone) window.location.href = 'tel:' + c.phone;
            }
        });

        // Quick Contact — already visible as flat bubble, no toggle needed

        function esc(s) {
            return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    })();
    </script>
</body>
</html>
